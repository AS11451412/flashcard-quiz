<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪卡问答 - AI 智能出题</title>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #16161e;
  --surface2: #1e1e2a;
  --border: #2a2a3a;
  --text: #e0e0e0;
  --text2: #a0a0b0;
  --text3: #6a6a7a;
  --accent: #7c6ff7;
  --accent2: #5b4fd6;
  --accent-glow: rgba(124,111,247,0.15);
  --green: #2ecc71;
  --green-bg: rgba(46,204,113,0.1);
  --red: #e74c3c;
  --red-bg: rgba(231,76,60,0.1);
  --yellow: #f1c40f;
  --yellow-bg: rgba(241,196,15,0.1);
  --radius: 12px;
  --radius-sm: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
  line-height: 1.6;
}
.container{
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 0 40px;
}

/* Header */
.header{
  text-align: center;
  padding: 30px 0 20px;
}
.header h1{
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, #a78bfa, #7c6ff7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.header .subtitle{
  font-size: 14px;
  color: var(--text3);
}

/* Card */
.card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  margin-bottom: 16px;
}
.card-label{
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: block;
}

/* Inputs */
input[type="text"], input[type="password"], textarea{
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 12px 14px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, textarea:focus{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
textarea{
  resize: vertical;
  min-height: 160px;
  line-height: 1.7;
}
.api-row{
  display: flex;
  gap: 8px;
}
.api-row input{flex:1}
.icon-btn{
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
  white-space: nowrap;
}
.icon-btn:hover{background: var(--border);color: var(--text)}

/* Pill buttons */
.pill-group{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.pill{
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  user-select: none;
}
.pill:hover{background: var(--border);color: var(--text)}
.pill.active{
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 12px var(--accent-glow);
}

/* Number pills */
.num-pills{
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.num-pill{
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  user-select: none;
}
.num-pill:hover{background: var(--border);color: var(--text)}
.num-pill.active{
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 12px var(--accent-glow);
}

/* Primary button */
.btn-primary{
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #8b7cf7, #6c5ce7);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}
.btn-primary:hover{
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(108,92,231,0.35);
}
.btn-primary:disabled{
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-secondary{
  display: inline-block;
  padding: 8px 22px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-secondary:hover{
  border-color: var(--accent);
  color: var(--accent);
}

/* Loading */
.loading-overlay{
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(13,13,13,0.85);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.loading-overlay.show{display: flex}

.live-panel{
  display: none;
  width: 85%;
  max-width: 640px;
  max-height: 280px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  flex-shrink: 0;
}
.live-panel.show{display: flex; flex-direction: column}
.live-title{
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.live-content{
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px;
  margin: 0;
  font-size: 12px;
  font-family: 'Consolas', 'Courier New', monospace;
  color: var(--text2);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.spinner{
  width: 44px;
  height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{
  color: var(--text2);
  font-size: 15px;
  text-align: center;
}

/* Quiz */
.quiz-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 0 4px;
}
.quiz-header .back-btn{
  background: none;
  border: none;
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  padding: 6px 10px;
  border-radius: 6px;
  transition: all 0.2s;
}
.quiz-header .back-btn:hover{background: var(--surface2);color: var(--text)}
.quiz-progress{
  font-size: 14px;
  color: var(--text2);
  font-weight: 500;
}
.quiz-progress span{color: var(--accent);font-weight: 700}

/* Question card */
.q-card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.q-card.answered{border-color: var(--accent)}
.q-number{
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.q-text{
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 18px;
  line-height: 1.7;
}

/* Option */
.option{
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface2);
}
.option:hover{border-color: var(--accent);background: var(--accent-glow)}
.option.selected{
  border-color: var(--accent);
  background: var(--accent-glow);
  box-shadow: 0 0 0 1px var(--accent);
}
.option-letter{
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--border);
  color: var(--text2);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.option.selected .option-letter{
  background: var(--accent);
  color: #fff;
}
.option-text{font-size: 14px;color: var(--text);line-height: 1.5;padding-top: 2px}

/* Multi-select */
.option.multi-selected{
  border-color: var(--accent);
  background: var(--accent-glow);
  box-shadow: 0 0 0 1px var(--accent);
}
.option.multi-selected .option-letter{
  background: var(--accent);
  color: #fff;
}
.option.multi-disabled{
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}
.multi-hint{
  font-size: 12px;
  color: var(--text3);
  margin-bottom: 10px;
}

/* Follow-up */
.followup-wrap{
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.fu-ask-btn{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--accent);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
}
.fu-ask-btn:hover{background: var(--accent);color: #fff;border-color: var(--accent)}
.fu-ask-btn:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none}
.fu-chat{margin-top:10px;display:none}
.fu-chat.active{display:block}
.fu-input-row{
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.fu-input-row input{
  flex:1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 10px 12px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.fu-input-row input:focus{border-color: var(--accent)}
.fu-send-btn{
  padding: 10px 16px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.fu-send-btn:hover{background: var(--accent2)}
.fu-send-btn:disabled{opacity:0.5;cursor:not-allowed}
.fu-user-q{
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text);
}
.fu-user-q .fu-label{color:var(--accent);font-weight:600;font-size:12px;margin-bottom:4px}
.fu-ai-r{
  background: var(--accent-glow);
  border: 1px solid rgba(124,111,247,0.2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.7;
  min-height: 20px;
  white-space: pre-wrap;
  word-break: break-word;
}
.fu-ai-r .fu-label{color:var(--accent);font-weight:600;font-size:12px;margin-bottom:6px}
.fu-ai-r .cursor-blink{
  display: inline-block;
  width: 8px;
  height: 15px;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 0.6s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Results */
.result-summary{
  text-align: center;
  padding: 20px 0;
}
.score-circle{
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid var(--accent);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 18px;
}
.score-num{
  font-size: 38px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}
.score-total{
  font-size: 13px;
  color: var(--text3);
}
.result-msg{
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}
.result-sub{
  font-size: 13px;
  color: var(--text3);
}

/* Review card */
.review-card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 14px;
}
.review-card.correct{border-left: 3px solid var(--green)}
.review-card.incorrect{border-left: 3px solid var(--red)}
.review-header{
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.badge{
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.badge-correct{background: var(--green-bg);color: var(--green)}
.badge-incorrect{background: var(--red-bg);color: var(--red)}
.review-q{font-size: 15px;font-weight: 500;color: var(--text);margin-bottom: 12px;line-height: 1.6}
.review-option{
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 13px;
  display: flex;
  gap: 8px;
}
.review-option .marker{font-weight: 700;flex-shrink: 0}
.review-option.correct-answer{background: var(--green-bg);color: var(--green)}
.review-option.user-correct{background: var(--green-bg);color: var(--green)}
.review-option.user-wrong{background: var(--red-bg);color: var(--red)}
.review-option.neutral{color: var(--text3)}
.explanation{
  margin-top: 12px;
  padding: 12px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
}

/* Text input question */
.text-answer-area{
  margin-top: 4px;
}
.text-answer-area textarea{
  width: 100%;
  min-height: 80px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 12px 14px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  resize: vertical;
  transition: border-color 0.2s;
}
.text-answer-area textarea:focus{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.q-type-badge{
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 8px;
  vertical-align: middle;
}
.q-type-badge.text{background: rgba(241,196,15,0.15);color: var(--yellow)}
.review-text-answer{
  padding: 10px 14px;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 13px;
}
.review-text-answer.correct{background: var(--green-bg);color: var(--green)}
.review-text-answer.incorrect{background: var(--red-bg);color: var(--red)}
.review-text-answer.ref{background: rgba(124,111,247,0.1);color: var(--accent)}
.allow-text-wrap{
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}
.allow-text-wrap input[type="checkbox"]{
  accent-color: var(--accent);
  width: 16px;
  height: 16px;
  cursor: pointer;
}

/* Toast */
.toast{
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--red);
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 200;
  opacity: 0;
  animation: toastIn 0.3s forwards, toastOut 0.3s 2.7s forwards;
}
.toast.success{background:var(--green)}
@keyframes toastIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-10px)}}
.toast{transform:translateX(-50%) translateY(-10px)}

/* Page visibility */
.page{display:none}
.page.active{display:block}

/* Save-key hint */
.save-hint{
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  font-size: 12px;
  color: var(--text3);
}
.save-hint input[type="checkbox"]{
  accent-color: var(--accent);
  width: 14px;
  height: 14px;
}

/* Responsive */
@media(max-width:500px){
  .container{padding: 0}
  .card{padding: 20px 16px}
  .header h1{font-size: 24px}
  .num-pill{width: 34px;height: 34px;font-size: 12px}
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>闪卡问答</h1>
    <p class="subtitle">粘贴内容 · AI 智能出题 · 即时测验</p>
  </div>

  <!-- ===== SETUP PAGE ===== -->
  <div class="page active" id="setupPage">
    <div class="card">
      <label class="card-label">AI 引擎</label>
      <div class="pill-group" id="engineGroup">
        <div class="pill active" data-engine="deepseek">DeepSeek</div>
        <div class="pill" data-engine="doubao">豆包</div>
      </div>
    </div>

    <div class="card" id="deepseekKeyCard">
      <label class="card-label">DeepSeek API Key</label>
      <div class="api-row">
        <input type="password" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxx">
        <button class="icon-btn" id="toggleKey" title="显示/隐藏">👁</button>
      </div>
      <div class="save-hint">
        <input type="checkbox" id="saveKey" checked>
        <span>记住 API Key（仅存本地）</span>
      </div>
    </div>

    <div class="card" id="doubaoKeyCard" style="display:none">
      <label class="card-label">豆包 API Key</label>
      <div class="api-row">
        <input type="password" id="doubaoKey" placeholder="ark-xxxxxxxxxxxxxxxx">
        <button class="icon-btn" id="toggleDoubaoKey" title="显示/隐藏">👁</button>
      </div>
      <div class="save-hint">
        <input type="checkbox" id="saveDoubaoKey" checked>
        <span>记住 API Key（仅存本地）</span>
      </div>
    </div>

    <div class="card">
      <label class="card-label">粘贴你要总结的内容</label>
      <textarea id="contentInput" placeholder="例如：我的世界服务器搭建需要先准备一台有公网IP的云服务器，推荐使用 Ubuntu 系统。安装 Java 运行环境后，下载 Minecraft 服务端 jar 文件，通过 screen 或 tmux 在后台运行。配置 server.properties 文件可以调整游戏模式、难度、最大玩家数等参数……&#10;&#10;粘贴越详细，生成的题目质量越高。"></textarea>
    </div>

    <div class="card">
      <label class="card-label">题目难度</label>
      <div class="pill-group" id="difficultyGroup">
        <div class="pill" data-diff="easy">简单</div>
        <div class="pill active" data-diff="medium">中等</div>
        <div class="pill" data-diff="hard">困难</div>
      </div>
    </div>

    <div class="card" id="allowTextCard">
      <label class="allow-text-wrap">
        <input type="checkbox" id="allowTextQuestions" checked> 允许少量填空题
      </label>
    </div>

    <div class="card" id="allowMultiCard">
      <label class="allow-text-wrap" id="multiLabel">
        <input type="checkbox" id="allowMultiSelect" checked> 启用多选题（六选二）
      </label>
    </div>

    <div class="card">
      <label class="card-label">题目数量 <span style="color:var(--accent);font-weight:700" id="countLabel">5</span> 道</label>
      <div class="num-pills" id="countGroup">
      </div>
    </div>

    <button class="btn-primary" id="generateBtn">AI 生成题目</button>
    <div style="margin-top:10px;display:flex;gap:10px;justify-content:center">
      <button class="btn-secondary" id="importBtn">📥 导入 JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>

  <!-- ===== QUIZ PAGE ===== -->
  <div class="page" id="quizPage">
    <div class="quiz-header">
      <button class="back-btn" id="backToSetup">← 返回修改</button>
      <div class="quiz-progress">共 <span id="quizCount">0</span> 道题目</div>
    </div>
    <div id="quizQuestions"></div>
    <button class="btn-primary" id="submitBtn">提交全部答案</button>
  </div>

  <!-- ===== RESULTS PAGE ===== -->
  <div class="page" id="resultsPage">
    <div class="result-summary" id="resultSummary"></div>
    <div id="resultReviews"></div>
    <button class="btn-primary" id="retryBtn" style="margin-top:8px">再来一轮</button>
    <button class="btn-secondary" id="copyJsonBtn" style="margin-top:5px;display:block;margin-left:auto;margin-right:auto">📋 复制题目 JSON</button>
  </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">正在调用 AI 生成题目…</div>
  <button class="fu-send-btn" id="cancelBtn" style="margin-top:12px;display:none">取消</button>
  <div class="live-panel" id="livePanel">
    <div class="live-title">AI 实时输出</div>
    <pre class="live-content" id="liveContent"></pre>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" style="display:none"></div>

<script>
(function(){
  // === DOM refs ===
  const $ = id => document.getElementById(id);
  const setupPage = $('setupPage');
  const quizPage = $('quizPage');
  const resultsPage = $('resultsPage');
  const apiKeyInput = $('apiKey');
  const toggleKeyBtn = $('toggleKey');
  const saveKeyCb = $('saveKey');
  const contentInput = $('contentInput');
  const countLabel = $('countLabel');
  const generateBtn = $('generateBtn');
  const quizQuestions = $('quizQuestions');
  const quizCount = $('quizCount');
  const submitBtn = $('submitBtn');
  const resultSummary = $('resultSummary');
  const resultReviews = $('resultReviews');
  const retryBtn = $('retryBtn');
  const loadingOverlay = $('loadingOverlay');
  const loadingText = $('loadingText');
  const toast = $('toast');
  const livePanel = $('livePanel');
  const liveContent = $('liveContent');
  const importBtn = $('importBtn');
  const importFile = $('importFile');
  const copyJsonBtn = $('copyJsonBtn');
  const difficultyGroup = $('difficultyGroup');
  const countGroup = $('countGroup');
  const allowTextCb = $('allowTextQuestions');
  const allowTextCard = $('allowTextCard');
  const allowMultiCb = $('allowMultiSelect');
  const multiLabel = $('multiLabel');
  const engineGroup = $('engineGroup');
  const deepseekKeyCard = $('deepseekKeyCard');
  const doubaoKeyCard = $('doubaoKeyCard');
  const doubaoKeyInput = $('doubaoKey');
  const toggleDoubaoKeyBtn = $('toggleDoubaoKey');
  const saveDoubaoKeyCb = $('saveDoubaoKey');

  // === State ===
  let difficulty = 'medium';
  let questionCount = 5;
  let questions = [];
  let userAnswers = [];
  let followUpAsked = [];
  let currentAbort = null;
  let engine = 'deepseek'; // 'deepseek' or 'doubao' // track current request for cancellation

  // === Init ===
  function init(){
    // Load saved API key
    const saved = localStorage.getItem('fc_api_key');
    if(saved){ apiKeyInput.value = saved; saveKeyCb.checked = true; }

    // Toggle key visibility
    toggleKeyBtn.addEventListener('click',()=>{
      const t = apiKeyInput.type === 'password' ? 'text' : 'password';
      apiKeyInput.type = t;
      toggleKeyBtn.textContent = t === 'password' ? '👁' : '🙈';
    });

    // Difficulty pills
    difficultyGroup.querySelectorAll('.pill').forEach(p=>{
      p.addEventListener('click',()=>{
        difficultyGroup.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
        p.classList.add('active');
        difficulty = p.dataset.diff;
        // Show text-question checkbox only for medium/hard
        allowTextCard.style.display = (difficulty === 'easy') ? 'none' : '';
      });
    });

    // Count pills: 1-10
    for(let i=1;i<=30;i++){
      const p = document.createElement('div');
      p.className = 'num-pill' + (i===5?' active':'');
      p.textContent = i;
      p.dataset.n = i;
      p.addEventListener('click',()=>{
        countGroup.querySelectorAll('.num-pill').forEach(x=>x.classList.remove('active'));
        p.classList.add('active');
        questionCount = i;
        countLabel.textContent = i;
        // Disable multi-select if < 3
        if (i < 3) {
          allowMultiCb.disabled = true;
          multiLabel.style.opacity = '0.5';
        } else {
          allowMultiCb.disabled = false;
          multiLabel.style.opacity = '';
        }
      });
      countGroup.appendChild(p);
    }

    // Generate
    generateBtn.addEventListener('click', generateQuestions);

    // Back
    $('backToSetup').addEventListener('click',()=>{ showPage('setup'); });

    // Submit
    submitBtn.addEventListener('click', submitQuiz);

    // Retry
    retryBtn.addEventListener('click',()=>{ contentInput.value=''; showPage('setup'); });

    // Engine pills
    engineGroup.querySelectorAll('.pill').forEach(p=>{
      p.addEventListener('click',()=>{
        engineGroup.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
        p.classList.add('active');
        engine = p.dataset.engine;
        deepseekKeyCard.style.display = (engine === 'deepseek') ? '' : 'none';
        doubaoKeyCard.style.display = (engine === 'doubao') ? '' : 'none';
        // Doubao max=20; if count>20, auto-reduce
        if(engine === 'doubao' && questionCount > 20){
          questionCount = 20;
          countLabel.textContent = 20;
          countGroup.querySelectorAll('.num-pill').forEach(x=>x.classList.remove('active'));
          countGroup.querySelector('.num-pill[data-n="20"]')?.classList.add('active');
        }
        // Update pill visibility
        countGroup.querySelectorAll('.num-pill').forEach(x=>{
          const n = parseInt(x.dataset.n);
          if(engine === 'doubao' && n > 20){
            x.style.opacity = '0.3';
            x.style.pointerEvents = 'none';
          } else {
            x.style.opacity = '';
            x.style.pointerEvents = '';
          }
        });
        // Disable multi if count < 3
        if(questionCount < 3){ allowMultiCb.disabled = true; multiLabel.style.opacity = '0.5'; }
        else { allowMultiCb.disabled = false; multiLabel.style.opacity = ''; }
      });
    });

    // Doubao key toggle
    toggleDoubaoKeyBtn.addEventListener('click',()=>{
      const t = doubaoKeyInput.type === 'password' ? 'text' : 'password';
      doubaoKeyInput.type = t;
      toggleDoubaoKeyBtn.textContent = t === 'password' ? '👁' : '🙈';
    });

    // Load saved Doubao key
    const savedDoubao = localStorage.getItem('fc_doubao_key');
    if(savedDoubao){ doubaoKeyInput.value = savedDoubao; saveDoubaoKeyCb.checked = true; }

    // Import JSON
    // Import JSON: clipboard first, fallback to file
    importBtn.addEventListener('click',async ()=>{
      try{
        const text = await navigator.clipboard.readText();
        const parsed = JSON.parse(text);
        if(!Array.isArray(parsed) || parsed.length === 0) throw new Error('不是有效题目数组');
        // Validate
        parsed.forEach((q,i)=>{
          if(!q.type) q.type = 'choice';
          if(q.type === 'choice')
            { if(!Array.isArray(q.options)||q.options.length!==5||typeof q.correctIndex!=='number') throw new Error(`第${i+1}题格式有误`); }
          else if(q.type === 'multi')
            { if(!Array.isArray(q.options)||q.options.length!==6||!Array.isArray(q.correctIndexes)||q.correctIndexes.length!==2) throw new Error(`第${i+1}题格式有误`); }
          else if(q.type === 'text')
            { if(!q.referenceAnswer) throw new Error(`第${i+1}题缺少referenceAnswer`); }
        });
        questions = parsed;
        userAnswers = questions.map(() => ({ selectedIndex: null, selectedIndexes: [], textAnswer: '', confidence: null }));
        followUpAsked = questions.map(() => false);
        renderQuiz();
        showPage('quiz');
        showToast('已从剪贴板导入 ' + questions.length + ' 道题目', 'success');
        return;
      }catch(e){
        // Clipboard failed → fallback to file
        importFile.click();
      }
    });
    importFile.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const parsed = JSON.parse(ev.target.result);
          if(!Array.isArray(parsed) || parsed.length === 0) throw new Error('数组为空');
          parsed.forEach((q,i)=>{
            if(!q.type) q.type = 'choice';
            if(q.type === 'choice'){
              if(!Array.isArray(q.options) || q.options.length !== 5 || typeof q.correctIndex !== 'number')
                throw new Error(`第${i+1}题格式有误`);
            }else if(q.type === 'multi'){
              if(!Array.isArray(q.options) || q.options.length !== 6 || !Array.isArray(q.correctIndexes) || q.correctIndexes.length !== 2)
                throw new Error(`第${i+1}题格式有误`);
            }else if(q.type === 'text'){
              if(!q.referenceAnswer) throw new Error(`第${i+1}题缺少referenceAnswer`);
            }
          });
          questions = parsed;
          userAnswers = questions.map(() => ({ selectedIndex: null, selectedIndexes: [], textAnswer: '', confidence: null }));
          followUpAsked = questions.map(() => false);
          renderQuiz();
          showPage('quiz');
        }catch(err){
          showToast('JSON 格式无效：' + err.message);
        }
      };
      reader.readAsText(file);
      importFile.value = '';
    });

    // Copy JSON
    copyJsonBtn.addEventListener('click', ()=>{
      if(!questions.length) return showToast('没有题目可复制');
      const json = JSON.stringify(questions, null, 2);
      navigator.clipboard.writeText(json).then(()=>{
        showToast('题目 JSON 已复制到剪贴板');
      }).catch(()=>{
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = json;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制');
      });
    });
  }

  // === Show page ===
  function showPage(name){
    [setupPage, quizPage, resultsPage].forEach(p=>p.classList.remove('active'));
    if(name==='setup') setupPage.classList.add('active');
    if(name==='quiz') quizPage.classList.add('active');
    if(name==='results') resultsPage.classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // === Toast ===
  function showToast(msg, type='error'){
    toast.textContent = msg;
    toast.className = 'toast' + (type === 'success' ? ' success' : '');
    toast.style.display = 'block';
    toast.style.animation = 'none';
    toast.offsetHeight;
    toast.style.animation = 'toastIn 0.3s forwards, toastOut 0.3s 2.7s forwards';
    setTimeout(()=>{ toast.style.display = 'none'; }, 3000);
  }

  // === API Call ===
  async function callDeepSeek(systemPrompt, userPrompt, retries=3){
    const isDoubao = engine === 'doubao';
    const endpoint = isDoubao
      ? 'https://ark.cn-beijing.volces.com/api/v3/chat/completions'
      : 'https://api.deepseek.com/chat/completions';
    const model = isDoubao ? 'doubao-seed-2-1-turbo-260628' : 'deepseek-v4-flash';
    const key = isDoubao ? doubaoKeyInput.value.trim() : apiKeyInput.value.trim();
    const keyName = isDoubao ? '豆包' : 'DeepSeek';
    if(!key) throw new Error(`请填写 ${keyName} API Key`);

    // Save key
    if(isDoubao){
      if(saveDoubaoKeyCb.checked) localStorage.setItem('fc_doubao_key', key);
      else localStorage.removeItem('fc_doubao_key');
    } else {
      if(saveKeyCb.checked) localStorage.setItem('fc_api_key', key);
      else localStorage.removeItem('fc_api_key');
    }

    const bodyObj = {
      model,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt }
      ],
      stream: false
    };
    if(!isDoubao){
      bodyObj.thinking = { type: 'enabled' };
      bodyObj.reasoning_effort = 'high';
    }

    let lastErr;

    try {
    for(let attempt=1; attempt<=retries; attempt++){
      if(currentAbort?.signal?.aborted) throw new DOMException('用户取消', 'AbortError');

      // Per-attempt timeout with Promise.race
      const timeoutController = new AbortController();
      if(currentAbort) currentAbort.signal.addEventListener('abort', () => timeoutController.abort());
      const signal = timeoutController.signal;

      let timeoutId;
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          timeoutController.abort();
          reject(new DOMException('请求超时', 'TimeoutError'));
        }, engine === 'doubao' ? 240000 : (questionCount > 20 ? 240000 : questionCount >= 15 ? 180000 : questionCount >= 10 ? 120000 : 60000));
      });
      const res = await Promise.race([
        timeoutPromise,
        fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`
        },
        body: JSON.stringify(bodyObj),
        signal
      })
    ]);

      clearTimeout(timeoutId);

      if(res.ok){
        const data = await res.json();
        const msg = data.choices?.[0]?.message || {};
        const content = msg.content || '';
        const reasoning = msg.reasoning_content || '';

        // Console logging
        console.group('%c🤖 ' + keyName + ' API 响应', 'color:#a78bfa;font-weight:bold;font-size:14px');
        console.log('%c模型：%c' + data.model, 'color:#888', 'color:#e0e0e0');
        console.log('%c请求ID：%c' + data.id, 'color:#888', 'color:#e0e0e0');
        if(reasoning){
          console.group('%c🧠 AI 思考过程 (reasoning_content)', 'color:#f1c40f;font-weight:bold');
          console.log(reasoning);
          console.groupEnd();
        } else {
          console.log('%c🧠 思考过程：%c(本次响应无 reasoning_content)', 'color:#f1c40f', 'color:#666');
        }
        console.group('%c📝 AI 最终输出 (content)', 'color:#2ecc71;font-weight:bold');
        console.log(content);
        console.groupEnd();
        if(data.usage){
          console.log('%c📊 Token 用量：%c输入 ' + data.usage.prompt_tokens + ' + 输出 ' + data.usage.completion_tokens + ' = 合计 ' + data.usage.total_tokens, 'color:#888', 'color:#e0e0e0');
        }
        console.groupEnd();
        return content;
      }

      const errText = await res.text();
      lastErr = new Error(`API 错误 (${res.status}): ${errText.slice(0,200)}`);

      // Retry on 5xx errors
      if(res.status >= 500 && attempt < retries){
        if(currentAbort?.signal?.aborted) throw new DOMException('用户取消', 'AbortError');
        console.warn(`%c⚠️ 第 ${attempt} 次请求失败 (${res.status})，${Math.pow(2,attempt)}秒后重试…`, 'color:#f1c40f');
        loadingText.textContent = `服务繁忙，正在重试 (${attempt}/${retries-1})…`;
        cancelBtn.style.display = 'inline-block';
        await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
        if(currentAbort?.signal?.aborted) throw new DOMException('用户取消', 'AbortError');
      } else {
        throw lastErr;
      }
    }
    } catch(e) {
      throw e;
    }
  }

  // === Stream with live panel (for Doubao) ===
  async function streamWithPanel(systemPrompt, userPrompt){
    livePanel.classList.add('show');
    liveContent.textContent = '';
    let fullContent = '';

    await streamDeepSeek(
      systemPrompt,
      userPrompt,
      // onReasoning → panel + console
      (chunk) => {
        liveContent.textContent += chunk;
        liveContent.scrollTop = liveContent.scrollHeight;
        console.debug('%c[思考]%c ' + chunk, 'color:#f1c40f', 'color:#999');
      },
      // onContent → panel + console + accumulate
      (chunk) => {
        fullContent += chunk;
        liveContent.textContent += chunk;
        liveContent.scrollTop = liveContent.scrollHeight;
        console.debug('%c[输出]%c ' + chunk, 'color:#2ecc71', 'color:#e0e0e0');
      }
    );
    console.group('%c📝 豆包完整输出', 'color:#2ecc71;font-weight:bold');
    console.log(fullContent);
    console.groupEnd();
    return fullContent;
  }

  // === Generate Questions ===
  async function generateQuestions(){
    const content = contentInput.value.trim();
    if(!content) return showToast('请先粘贴要总结的内容');

    const key = (engine === 'doubao') ? doubaoKeyInput.value.trim() : apiKeyInput.value.trim();
    const keyName = (engine === 'doubao') ? '豆包' : 'DeepSeek';
    if(!key) return showToast('请填写 ' + keyName + ' API Key');

    // Save key
    if(engine === 'doubao'){
      if(saveDoubaoKeyCb.checked) localStorage.setItem('fc_doubao_key', key);
    } else {
      if(saveKeyCb.checked) localStorage.setItem('fc_api_key', key);
    }

    // Show loading
    generateBtn.disabled = true;
    loadingText.textContent = '正在调用 AI 生成题目…';
    loadingOverlay.classList.add('show');
    cancelBtn.style.display = 'none';

    // Set up abort controller
    currentAbort = new AbortController();
    cancelBtn.onclick = () => { currentAbort.abort(); };

    try{
      const diffMap = { easy: '简单', medium: '中等', hard: '困难' };

      // Calculate question type counts
      const calcTextCount = (total) => {
        if (total < 2) return 0;
        if (total < 5) return 1;
        return Math.floor(total / 5) * 2;
      };
      const multiCount = (allowMultiCb.checked && questionCount >= 3) ? (questionCount >= 21 ? 4 : 2) : 0;
      const remainingCount = questionCount - multiCount;
      const textCount = (difficulty !== 'easy' && allowTextCb.checked) ? calcTextCount(remainingCount) : 0;
      const choiceCount = remainingCount - textCount;

      const parts = [];
      if (multiCount > 0) parts.push(`${multiCount} 道多选题（六选二）`);
      if (choiceCount > 0) parts.push(`${choiceCount} 道单选题（五选一）`);
      if (textCount > 0) parts.push(`${textCount} 道填空题`);

      const systemPrompt = `你是一个专业的题目生成器。根据用户提供的内容，生成一共 ${questionCount} 道${diffMap[difficulty]}难度的题目。

其中：${parts.join('，')}。

规则：
${multiCount > 0 ? `1. 多选题（type:"multi"）：6 个选项（A 到 F），恰好 2 个正确答案（correctIndexes 数组含 2 个索引）\n` : ''}${choiceCount > 0 ? `${multiCount > 0 ? '2' : '1'}. 单选题（type:"choice"）：5 个选项（A 到 E），1 个正确答案\n` : ''}${textCount > 0 ? `${(multiCount>0?1:0)+(choiceCount>0?1:0)+1}. 填空题（type:"text"）：用户手动输入文字作答，答案必须为明确的短词/数字/短语，referenceAnswer 是标准答案\n` : ''}${multiCount+choiceCount+textCount > 0 ? (multiCount+choiceCount+textCount)+1 : ''}. 题目必须基于用户提供的文本内容
${multiCount+choiceCount+textCount > 0 ? (multiCount+choiceCount+textCount)+2 : ''}. ${difficulty==='easy'?'简单难度：考察关键事实和基础概念':''
}${difficulty==='medium'?'中等难度：考察理解和应用，需要一定的分析和判断':''
}${difficulty==='hard'?'困难难度：考察深层理解和推理，容易混淆':''}
${multiCount+choiceCount+textCount > 0 ? (multiCount+choiceCount+textCount)+3 : ''}. 每道题附带一句话简短解释

所有题目、选项和解释必须使用中文。即使原文包含英文术语，也应使用中文表述。

你必须只回复一个 JSON 数组，不要包含任何其他文字。格式如下：
[
  ${multiCount>0?`{"type":"multi","question":"题目文本","options":["A","B","C","D","E","F"],"correctIndexes":[0,3],"explanation":"解释"},`+'\n  ':''}${choiceCount>0?`{"type":"choice","question":"题目文本","options":["A","B","C","D","E"],"correctIndex":0,"explanation":"解释"},`+'\n  ':''}${textCount>0?`{"type":"text","question":"题目文本","referenceAnswer":"标准答案","explanation":"解释"}`+'\n':''}
]

correctIndex 从 0 开始，correctIndexes 是恰好含 2 个索引的数组。
数组必须恰好包含${parts.join('，')}。`;

      const userPrompt = `请根据以下内容生成 ${questionCount} 道${diffMap[difficulty]}难度的题目（${parts.join('，')}）：\n\n${content}`;

      loadingText.textContent = engine === 'doubao' ? '豆包正在生成题目…' : 'AI 正在深度思考中…';
      const raw = engine === 'doubao'
        ? await streamWithPanel(systemPrompt, userPrompt)
        : await callDeepSeek(systemPrompt, userPrompt);

      // Parse JSON from response (strip Doubao preamble, handle markdown)
      let jsonStr = raw.trim();
      jsonStr = jsonStr.replace(/^```(?:json)?\s*\n?/i, '').replace(/\n?```\s*$/, '');
      // Strip Doubao's verbose preambles: everything before the first '['
      const startIdx = jsonStr.indexOf('[');
      const endIdx = jsonStr.lastIndexOf(']');
      if(startIdx !== -1 && endIdx > startIdx) jsonStr = jsonStr.slice(startIdx, endIdx + 1);
      else {
        const match = jsonStr.match(/\[[\s\S]*\]/);
        if(match) jsonStr = match[0];
      }

      const parsed = JSON.parse(jsonStr);
      if(!Array.isArray(parsed) || parsed.length === 0){
        throw new Error('AI 返回的题目格式不正确，请重试');
      }

      // Validate each question
      parsed.forEach((q, i) => {
        if (!q.question) throw new Error(`第 ${i+1} 道题目缺少 question`);
        if (!q.type) q.type = 'choice';
        if (q.type === 'choice') {
          if (!Array.isArray(q.options) || q.options.length !== 5 || typeof q.correctIndex !== 'number') {
            throw new Error(`第 ${i+1} 道选择题格式有误，请重试`);
          }
        } else if (q.type === 'text') {
          if (!q.referenceAnswer) throw new Error(`第 ${i+1} 道填空题缺少 referenceAnswer，请重试`);
        } else if (q.type === 'multi') {
          if (!Array.isArray(q.options) || q.options.length !== 6 || !Array.isArray(q.correctIndexes) || q.correctIndexes.length !== 2) {
            throw new Error(`第 ${i+1} 道多选题格式有误（需6选项、2个正确索引），请重试`);
          }
        }
      });

      questions = parsed.slice(0, questionCount);
      userAnswers = questions.map(() => ({ selectedIndex: null, selectedIndexes: [], textAnswer: '', confidence: null }));
      followUpAsked = questions.map(() => false);

      // --- Console logging ---
      console.group('%c📋 解析完成的题目 (%c' + questions.length + ' 道%c, 其中多选 %c' + questions.filter(q=>q.type==='multi').length + ' 道%c, 单选 %c' + questions.filter(q=>!q.type||q.type==='choice').length + ' 道%c, 填空 %c' + questions.filter(q=>q.type==='text').length + ' 道%c)', 'color:#a78bfa;font-weight:bold', 'color:#fff', 'color:#a78bfa', 'color:#fff', 'color:#a78bfa', 'color:#fff', 'color:#a78bfa', 'color:#fff', 'color:#a78bfa');
      questions.forEach((q, i) => {
        if (!q.type || q.type === 'choice') {
          console.group('%c第 ' + (i+1) + ' 题 [选择]%c (答案: ' + String.fromCharCode(65+q.correctIndex) + ')', 'color:#e0e0e0;font-weight:bold', 'color:#2ecc71');
          console.log('%cQ:%c ' + q.question, 'color:#f1c40f', 'color:#e0e0e0');
          q.options.forEach((o, oi) => {
            console.log('%c  ' + String.fromCharCode(65+oi) + '.%c ' + o + (oi===q.correctIndex?' ✅':''), 'color:#888', 'color:'+(oi===q.correctIndex?'#2ecc71':'#e0e0e0'));
          });
          console.log('%c💡%c ' + (q.explanation || '无'), 'color:#f1c40f', 'color:#a0a0b0');
          console.groupEnd();
        } else if (q.type === 'multi') {
          console.group('%c第 ' + (i+1) + ' 题 [多选]%c (答案: ' + q.correctIndexes.map(ci=>String.fromCharCode(65+ci)).join(' + ') + ')', 'color:#a78bfa;font-weight:bold', 'color:#2ecc71');
          console.log('%cQ:%c ' + q.question, 'color:#f1c40f', 'color:#e0e0e0');
          q.options.forEach((o, oi) => {
            console.log('%c  ' + String.fromCharCode(65+oi) + '.%c ' + o + (q.correctIndexes.includes(oi)?' ✅':''), 'color:#888', 'color:'+(q.correctIndexes.includes(oi)?'#2ecc71':'#e0e0e0'));
          });
          console.log('%c💡%c ' + (q.explanation || '无'), 'color:#f1c40f', 'color:#a0a0b0');
          console.groupEnd();
        } else {
          console.group('%c第 ' + (i+1) + ' 题 [文本]%c (参考答案: ' + q.referenceAnswer + ')', 'color:#f1c40f;font-weight:bold', 'color:#2ecc71');
          console.log('%cQ:%c ' + q.question, 'color:#f1c40f', 'color:#e0e0e0');
          console.log('%c📎 参考答案: %c' + q.referenceAnswer, 'color:#f1c40f', 'color:#2ecc71');
          console.log('%c💡%c ' + (q.explanation || '无'), 'color:#f1c40f', 'color:#a0a0b0');
          console.groupEnd();
        }
      });
      console.groupEnd();
      // --- end ---

      renderQuiz();
      showPage('quiz');
    }catch(e){
      if(e.name === 'TimeoutError'){
        showToast('请求超时，请重试');
      }else if(e.name !== 'AbortError'){
        console.error(e);
        showToast(e.message || '生成题目失败，请检查 API Key 和网络连接');
      }
    }finally{
      generateBtn.disabled = false;
      loadingOverlay.classList.remove('show');
      livePanel.classList.remove('show');
      cancelBtn.style.display = 'none';
      currentAbort = null;
    }
  }

  // === Render Quiz ===
  function renderQuiz(){
    quizCount.textContent = questions.length;
    let html = '';
    questions.forEach((q, qi)=>{
      const isText = q.type === 'text';
      const isMulti = q.type === 'multi';
      let badge = '';
      if (isText) badge = '<span class="q-type-badge text">填空题</span>';
      else if (isMulti) badge = '<span class="q-type-badge text" style="background:rgba(167,139,250,0.15);color:#a78bfa">多选题</span>';
      html += `<div class="q-card" id="qcard-${qi}">
        <div class="q-number">第 ${qi+1} 题 ${badge}</div>
        <div class="q-text">${escapeHtml(q.question)}</div>`;

      if (isText) {
        html += `<div class="text-answer-area">
          <textarea id="text-answer-${qi}" placeholder="输入你的答案…" data-q="${qi}"></textarea>
        </div>`;
      } else if (isMulti) {
        html += `<div class="multi-hint">请选择恰好 2 个正确选项</div>`;
        q.options.forEach((opt, oi)=>{
          html += `<div class="option multi-opt" data-q="${qi}" data-o="${oi}" id="opt-${qi}-${oi}">
            <div class="option-letter">${String.fromCharCode(65+oi)}</div>
            <div class="option-text">${escapeHtml(opt)}</div>
          </div>`;
        });
      } else {
        q.options.forEach((opt, oi)=>{
          html += `<div class="option" data-q="${qi}" data-o="${oi}" id="opt-${qi}-${oi}">
            <div class="option-letter">${String.fromCharCode(65+oi)}</div>
            <div class="option-text">${escapeHtml(opt)}</div>
          </div>`;
        });
      }

      html += `<div class="followup-wrap">
        <button class="fu-ask-btn" data-fu="${qi}">💬 追问</button>
        <div class="fu-chat" id="qfu-chat-${qi}">
          <div class="fu-input-row">
            <input type="text" id="qfu-input-${qi}" placeholder="输入你想追问的问题…" maxlength="300">
            <button class="fu-send-btn" id="qfu-send-${qi}">发送</button>
          </div>
          <div class="fu-user-q" id="qfu-user-${qi}" style="display:none"></div>
          <div class="fu-ai-r" id="qfu-ai-${qi}" style="display:none"></div>
        </div>
      </div>
      </div>`;
    });

    quizQuestions.innerHTML = html;

    // Attach single-choice option handlers
    quizQuestions.querySelectorAll('.option:not(.multi-opt)').forEach(opt=>{
      opt.addEventListener('click',()=>{
        const qi = parseInt(opt.dataset.q);
        const oi = parseInt(opt.dataset.o);
        quizQuestions.querySelectorAll(`.option[data-q="${qi}"]`).forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
        userAnswers[qi].selectedIndex = oi;
        $('qcard-'+qi).classList.add('answered');
      });
    });

    // Attach multi-select option handlers
    quizQuestions.querySelectorAll('.multi-opt').forEach(opt=>{
      opt.addEventListener('click',()=>{
        const qi = parseInt(opt.dataset.q);
        const oi = parseInt(opt.dataset.o);
        const sel = userAnswers[qi].selectedIndexes;

        if (sel.includes(oi)) {
          // Deselect
          opt.classList.remove('multi-selected');
          userAnswers[qi].selectedIndexes = sel.filter(x => x !== oi);
        } else if (sel.length < 2) {
          // Select
          opt.classList.add('multi-selected');
          userAnswers[qi].selectedIndexes = [...sel, oi];
        }
        // If 2 selected, disable others
        const allOpts = quizQuestions.querySelectorAll(`.multi-opt[data-q="${qi}"]`);
        if (userAnswers[qi].selectedIndexes.length >= 2) {
          allOpts.forEach(o => {
            if (!o.classList.contains('multi-selected')) o.classList.add('multi-disabled');
          });
        } else {
          allOpts.forEach(o => o.classList.remove('multi-disabled'));
        }
        $('qcard-'+qi).classList.toggle('answered', userAnswers[qi].selectedIndexes.length === 2);
      });
    });

    // Attach text input handlers
    quizQuestions.querySelectorAll('.text-answer-area textarea').forEach(ta => {
      ta.addEventListener('input', () => {
        const qi = parseInt(ta.dataset.q);
        userAnswers[qi].textAnswer = ta.value;
        if (ta.value.trim()) $('qcard-'+qi).classList.add('answered');
      });
    });

    // Attach quiz-page follow-up listeners
    quizQuestions.querySelectorAll('.fu-ask-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const qi = parseInt(btn.dataset.fu);
        if (followUpAsked[qi]) return;
        const chat = document.getElementById('qfu-chat-' + qi);
        const wasActive = chat.classList.contains('active');
        chat.classList.toggle('active');
        if (!wasActive) {
          document.getElementById('qfu-input-' + qi).focus();
        }
      });
    });
    quizQuestions.querySelectorAll('.fu-send-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const qi = parseInt(btn.id.replace('qfu-send-', ''));
        const input = document.getElementById('qfu-input-' + qi);
        const query = input.value.trim();
        if (!query || followUpAsked[qi]) return;
        btn.disabled = true;
        input.disabled = true;
        startFollowUp(qi, query, 'qfu-');
      });
    });
    quizQuestions.querySelectorAll('.fu-input-row input').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const qi = parseInt(input.id.replace('qfu-input-', ''));
          document.getElementById('qfu-send-' + qi).click();
        }
      });
    });

  }

  // === Submit Quiz ===
  async function submitQuiz(){
    // Collect text answers from DOM (in case user typed but we missed)
    questions.forEach((q, i) => {
      if (q.type === 'text') {
        const ta = document.getElementById('text-answer-' + i);
        if (ta) userAnswers[i].textAnswer = ta.value;
      }
    });

    // Validate all answered
    let hasUnanswered = false;
    userAnswers.forEach((a, i) => {
      const q = questions[i];
      if (!q.type || q.type === 'choice') {
        if (a.selectedIndex === null) hasUnanswered = true;
      } else if (q.type === 'text') {
        if (!a.textAnswer.trim()) hasUnanswered = true;
      } else if (q.type === 'multi') {
        if (a.selectedIndexes.length !== 2) hasUnanswered = true;
      }
    });
    if (hasUnanswered) {
      showToast('请完成所有题目后再提交');
      userAnswers.forEach((a, i) => {
        const q = questions[i];
        let empty;
        if (!q.type || q.type === 'choice') empty = (a.selectedIndex === null);
        else if (q.type === 'text') empty = (!a.textAnswer.trim());
        else empty = (a.selectedIndexes.length !== 2);
        if (empty) {
          $('qcard-' + i).style.borderColor = 'var(--red)';
          setTimeout(() => { $('qcard-' + i).style.borderColor = ''; }, 2000);
        }
      });
      return;
    }

    // Show loading for text judgment
    submitBtn.disabled = true;
    loadingText.textContent = '正在评判填空题答案…';
    loadingOverlay.classList.add('show');
    cancelBtn.style.display = 'none';

    // Set up abort controller
    currentAbort = new AbortController();
    cancelBtn.onclick = () => { currentAbort.abort(); };

    try {
      // Judge text questions
      const textIndices = [];
      questions.forEach((q, i) => {
        if (q.type === 'text') textIndices.push(i);
      });

      if (textIndices.length > 0) {
        if(engine === 'doubao'){ livePanel.classList.add('show'); liveContent.textContent = ''; }
        // Exact match check first
        const needJudge = [];
        textIndices.forEach(i => {
          const q = questions[i];
          const ua = userAnswers[i].textAnswer.trim();
          const ref = q.referenceAnswer.trim();
          if (ua === ref) {
            userAnswers[i].textIsCorrect = true;
            userAnswers[i].textExactMatch = true;
            console.log('%c✅ 填空题第' + (i+1) + '题精确匹配:%c 用户"' + ua + '" = 参考"' + ref + '"', 'color:#2ecc71', 'color:#e0e0e0');
          } else {
            needJudge.push(i);
          }
        });

        // Batch-judge remaining via DeepSeek
        if (needJudge.length > 0) {
          const judgePromises = needJudge.map(async (i) => {
            const q = questions[i];
            const ua = userAnswers[i].textAnswer.trim();
            console.log('%c🔍 填空题第' + (i+1) + '题提交评判:%c 用户"' + ua + '" vs 参考"' + q.referenceAnswer + '"', 'color:#f1c40f', 'color:#e0e0e0');
            try {
              const judgeFn = engine === 'doubao' ? streamWithPanel : callDeepSeek;
              const result = await judgeFn(
                `你是一个严格的评分员。判断学生的答案是否正确。语义等价即可。只输出 JSON，禁止任何其他文字。`,
                `题目：${q.question}\n参考答案：${q.referenceAnswer}\n学生答案：${ua}\n\n请只回复一个 JSON：{"correct": true 或 false, "reason": "简短理由"}`
              );
              let cleaned = result.replace(/```json|```/g, '').trim();
              const s = cleaned.indexOf('{'), e = cleaned.lastIndexOf('}');
              if(s !== -1 && e > s) cleaned = cleaned.slice(s, e + 1);
              const json = JSON.parse(cleaned);
              userAnswers[i].textIsCorrect = !!json.correct;
              userAnswers[i].textJudgeReason = json.reason || '';
              console.log('%c📝 评判结果第' + (i+1) + '题:%c ' + (json.correct ? '正确' : '错误') + ' — ' + (json.reason || ''), json.correct ? 'color:#2ecc71' : 'color:#e74c3c', 'color:#e0e0e0');
            } catch (e) {
              // Fallback: compare case-insensitive
              const isCorrect = ua.toLowerCase() === q.referenceAnswer.toLowerCase();
              userAnswers[i].textIsCorrect = isCorrect;
              userAnswers[i].textJudgeReason = '（评判失败，按大小写不敏感比对）';
              console.warn('填空题评判API失败，fallback比对:', e.message);
            }
          });
          await Promise.all(judgePromises);
        }
      }

      // Calculate score
      let correctCount = 0;
      questions.forEach((q, i) => {
        let isCorrect;
        if (!q.type || q.type === 'choice') {
          isCorrect = userAnswers[i].selectedIndex === q.correctIndex;
        } else if (q.type === 'multi') {
          const sel = userAnswers[i].selectedIndexes.sort();
          const ans = [...q.correctIndexes].sort();
          isCorrect = sel.length === 2 && sel[0] === ans[0] && sel[1] === ans[1];
        } else {
          isCorrect = userAnswers[i].textIsCorrect;
        }
        userAnswers[i]._isCorrect = isCorrect;
        if (isCorrect) correctCount++;
      });

      // Summary
      const pct = Math.round((correctCount / questions.length) * 100);
      let msg = '';
      if (pct >= 90) msg = '太厉害了！';
      else if (pct >= 70) msg = '做得不错！';
      else if (pct >= 50) msg = '继续加油！';
      else msg = '多多练习！';

      resultSummary.innerHTML = `
        <div class="score-circle">
          <div class="score-num">${pct}%</div>
          <div class="score-total">${correctCount}/${questions.length} 正确</div>
        </div>
        <div class="result-msg">${msg}</div>
      `;

      // Per-question reviews
      let reviewsHtml = '';
      questions.forEach((q, i) => {
        const isCorrect = userAnswers[i]._isCorrect;

        if (!q.type || q.type === 'choice') {
          const userSel = userAnswers[i].selectedIndex;
          reviewsHtml += `<div class="review-card ${isCorrect ? 'correct' : 'incorrect'}">
            <div class="review-header">
              <span class="badge ${isCorrect ? 'badge-correct' : 'badge-incorrect'}">${isCorrect ? '✓ 回答正确' : '✗ 回答错误'}</span>
            </div>
            <div class="review-q">${escapeHtml(q.question)}</div>`;

          q.options.forEach((opt, oi) => {
            let cls = 'review-option neutral';
            let marker = String.fromCharCode(65 + oi);
            if (oi === q.correctIndex) {
              cls = 'review-option correct-answer';
              marker = '✓ ' + marker;
            } else if (oi === userSel && !isCorrect) {
              cls = 'review-option user-wrong';
              marker = '✗ ' + marker;
            }
            reviewsHtml += `<div class="${cls}"><span class="marker">${marker}.</span>${escapeHtml(opt)}</div>`;
          });

          reviewsHtml += `<div class="explanation">💡 ${escapeHtml(q.explanation || '暂无解析')}</div>`;
        } else if (q.type === 'multi') {
          const sel = userAnswers[i].selectedIndexes;
          const ans = q.correctIndexes;
          reviewsHtml += `<div class="review-card ${isCorrect ? 'correct' : 'incorrect'}">
            <div class="review-header">
              <span class="badge ${isCorrect ? 'badge-correct' : 'badge-incorrect'}">${isCorrect ? '✓ 回答正确' : '✗ 回答错误'}</span>
            </div>
            <div class="review-q">${escapeHtml(q.question)}</div>
            <div style="font-size:13px;margin-bottom:10px">
              <span style="color:var(--accent);font-weight:600">你的回答：</span><span style="color:${isCorrect?'var(--green)':'var(--red)'}">${sel.length ? sel.map(si=>String.fromCharCode(65+si)).join('、') : '(未选)'}</span>
              &nbsp;&nbsp;
              <span style="color:var(--text3);font-weight:600">正确答案：</span><span style="color:var(--green)">${ans.map(ai=>String.fromCharCode(65+ai)).join('、')}</span>
            </div>`;
          q.options.forEach((opt, oi) => {
            let cls = 'review-option neutral';
            let marker = String.fromCharCode(65 + oi);
            if (ans.includes(oi) && sel.includes(oi)) {
              cls = 'review-option correct-answer';
              marker = '✓ ' + marker;
            } else if (ans.includes(oi)) {
              cls = 'review-option correct-answer';
              marker = '✓ ' + marker;
            } else if (sel.includes(oi)) {
              cls = 'review-option user-wrong';
              marker = '✗ ' + marker;
            }
            reviewsHtml += `<div class="${cls}"><span class="marker">${marker}.</span>${escapeHtml(opt)}</div>`;
          });
          reviewsHtml += `<div class="explanation">💡 ${escapeHtml(q.explanation || '暂无解析')}</div>`;
        } else {
          // Text question review
          const ua = userAnswers[i].textAnswer.trim();
          reviewsHtml += `<div class="review-card ${isCorrect ? 'correct' : 'incorrect'}">
            <div class="review-header">
              <span class="badge ${isCorrect ? 'badge-correct' : 'badge-incorrect'}">${isCorrect ? '✓ 回答正确' : '✗ 回答错误'}</span>
            </div>
            <div class="review-q">${escapeHtml(q.question)}</div>
            <div class="review-text-answer ${isCorrect ? 'correct' : 'incorrect'}">你的答案：${escapeHtml(ua) || '(空)'}</div>
            ${userAnswers[i].textJudgeReason ? `<div class="review-text-answer ${isCorrect ? 'correct' : 'incorrect'}">评判理由：${escapeHtml(userAnswers[i].textJudgeReason)}</div>` : ''}
            <div class="review-text-answer ref">参考答案：${escapeHtml(q.referenceAnswer)}</div>
            <div class="explanation">💡 ${escapeHtml(q.explanation || '暂无解析')}</div>`;
        }

        reviewsHtml += `<div class="followup-wrap">
          <button class="fu-ask-btn" data-fu="${i}">💬 追问</button>
          <div class="fu-chat" id="fu-chat-${i}">
            <div class="fu-input-row">
              <input type="text" id="fu-input-${i}" placeholder="输入你想追问的问题…" maxlength="300">
              <button class="fu-send-btn" id="fu-send-${i}">发送</button>
            </div>
            <div class="fu-user-q" id="fu-user-${i}" style="display:none"></div>
            <div class="fu-ai-r" id="fu-ai-${i}" style="display:none"></div>
          </div>
        </div>
        </div>`;
      });

      resultReviews.innerHTML = reviewsHtml;

      // Attach follow-up event listeners (same as before)
      resultReviews.querySelectorAll('.fu-ask-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const qi = parseInt(btn.dataset.fu);
          if (followUpAsked[qi]) return;
          const chat = document.getElementById('fu-chat-' + qi);
          const wasActive = chat.classList.contains('active');
          chat.classList.toggle('active');
          if (!wasActive) document.getElementById('fu-input-' + qi).focus();
        });
      });
      resultReviews.querySelectorAll('.fu-send-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const qi = parseInt(btn.id.replace('fu-send-', ''));
          const input = document.getElementById('fu-input-' + qi);
          const query = input.value.trim();
          if (!query || followUpAsked[qi]) return;
          btn.disabled = true;
          input.disabled = true;
          startFollowUp(qi, query, 'fu-');
        });
      });
      resultReviews.querySelectorAll('.fu-input-row input').forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const qi = parseInt(input.id.replace('fu-input-', ''));
            document.getElementById('fu-send-' + qi).click();
          }
        });
      });

      showPage('results');
    } catch (e) {
      if(e.name === 'TimeoutError'){
        showToast('填空评判超时，请重试');
      }else if(e.name !== 'AbortError'){
        console.error(e);
        showToast('提交评判失败：' + e.message);
      }
    } finally {
      submitBtn.disabled = false;
      loadingOverlay.classList.remove('show');
      livePanel.classList.remove('show');
      cancelBtn.style.display = 'none';
      currentAbort = null;
    }
  }

  // === Follow-up Question (Streaming) ===
  async function startFollowUp(qi, userQuery, elemPrefix) {
    // elemPrefix: 'fu-' for results page, 'qfu-' for quiz page
    const p = elemPrefix || 'fu-';
    const aiEl = document.getElementById(p + 'ai-' + qi);
    const userEl = document.getElementById(p + 'user-' + qi);

    // Show user's question
    userEl.innerHTML = `<div class="fu-label">你的追问</div>${escapeHtml(userQuery)}`;
    userEl.style.display = 'block';

    // Show AI response container with cursor
    aiEl.innerHTML = `<div class="fu-label">AI 回复</div><span class="cursor-blink"></span>`;
    aiEl.style.display = 'block';

    let reasoningBuf = '';
    let contentBuf = '';

    const q = questions[qi];
    const isText = q.type === 'text';
    const isMulti = q.type === 'multi';

    let answerInfo, qTypeName;
    if (isText) {
      qTypeName = '文本';
      answerInfo = `参考答案：${q.referenceAnswer}`;
    } else if (isMulti) {
      qTypeName = '多选';
      answerInfo = `选项：${q.options.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('；')}\n正确答案（六选二）：${q.correctIndexes.map(ci=>String.fromCharCode(65+ci)+'. '+q.options[ci]).join(' 和 ')}`;
    } else {
      qTypeName = '选择';
      answerInfo = `选项：${q.options.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('；')}\n正确答案：${String.fromCharCode(65+q.correctIndex)}. ${q.options[q.correctIndex]}`;
    }

    const systemPrompt = difficulty === 'easy'
      ? `你是一个耐心助教。用户刚做完一道${qTypeName}题，正在追问。你已经知道这道题的内容和正确答案。
题目：${q.question}
${answerInfo}

规则：用户问什么你就答什么，可以直接告诉正确答案，通俗易懂地解释。回答精简在200字以内。必须使用中文回复。`
      : `你是一个循循善诱的助教。用户刚做完一道${qTypeName}题，正在追问。你已经知道这道题的内容和正确答案，但绝对不能直接说出答案。
题目：${q.question}
${answerInfo}

规则：
- 绝对不能直接说出正确答案
- 用引导式提问、提示、类比帮助用户自己推导
- 如果用户直接问"答案是什么"，婉拒并引导思考
- 回答精简在200字以内。必须使用中文回复。`;

    // Setup abort for timeout
    if (!currentAbort) currentAbort = new AbortController();

    try {
      await streamDeepSeek(
        systemPrompt,
        userQuery,
        // onReasoning — log to console only
        (chunk) => {
          reasoningBuf += chunk;
          console.debug('%c[思考]%c ' + chunk, 'color:#f1c40f', 'color:#999');
        },
        // onContent — stream to the HTML element
        (chunk) => {
          contentBuf += chunk;
          aiEl.innerHTML = `<div class="fu-label">AI 回复</div>${escapeHtml(contentBuf)}<span class="cursor-blink"></span>`;
          aiEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      );

      // Remove cursor
      aiEl.innerHTML = `<div class="fu-label">AI 回复</div>${escapeHtml(contentBuf)}`;
      followUpAsked[qi] = true;

      // Lock the ask button in current page's followup-wrap
      const askBtn = document.getElementById(p + 'chat-' + qi).parentElement.querySelector('.fu-ask-btn');
      if (askBtn) { askBtn.disabled = true; askBtn.textContent = '已追问'; }

      // Hide the input row, keep only user question + AI reply
      const inputRow = document.getElementById(p + 'chat-' + qi).querySelector('.fu-input-row');
      if (inputRow) inputRow.style.display = 'none';

      // --- Console: reasoning + content ---
      if (reasoningBuf) {
        console.group('%c🧠 追问思考过程 (第' + (qi+1) + '题)', 'color:#f1c40f;font-weight:bold');
        console.log(reasoningBuf);
        console.groupEnd();
      }
      console.group('%c📝 追问输出结果 (第' + (qi+1) + '题)', 'color:#2ecc71;font-weight:bold');
      console.log(contentBuf);
      console.groupEnd();
      // --- end ---
    } catch (e) {
      if(e.name === 'TimeoutError'){
        aiEl.innerHTML = `<div class="fu-label">AI 回复</div><span style="color:var(--red)">追问超时，可以重新发送</span>`;
        showToast('追问超时，请重试');
      }else{
        aiEl.innerHTML = `<div class="fu-label">AI 回复</div><span style="color:var(--red)">请求失败：${escapeHtml(e.message)}</span>`;
      }
      // Re-enable input — don't lock on timeout
      const input = document.getElementById(p + 'input-' + qi);
      const sendBtn = document.getElementById(p + 'send-' + qi);
      if (input) input.disabled = false;
      if (sendBtn) sendBtn.disabled = false;
    }
  }

  async function streamDeepSeek(systemPrompt, userPrompt, onReasoning, onContent, retries=3) {
    const isDoubao = engine === 'doubao';
    const endpoint = isDoubao
      ? 'https://ark.cn-beijing.volces.com/api/v3/chat/completions'
      : 'https://api.deepseek.com/chat/completions';
    const model = isDoubao ? 'doubao-seed-2-1-turbo-260628' : 'deepseek-v4-flash';
    const key = isDoubao ? doubaoKeyInput.value.trim() : apiKeyInput.value.trim();

    const bodyObj = {
      model,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt }
      ],
      stream: true
    };
    if(!isDoubao){
      bodyObj.thinking = { type: 'enabled' };
      bodyObj.reasoning_effort = 'high';
    }
    const body = JSON.stringify(bodyObj);

    let lastErr;

    try {
    for(let attempt=1; attempt<=retries; attempt++){
      if(currentAbort?.signal?.aborted) throw new DOMException('用户取消', 'AbortError');

      const timeoutController = new AbortController();
      if(currentAbort) currentAbort.signal.addEventListener('abort', () => timeoutController.abort());

      let timeoutId;
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          timeoutController.abort();
          reject(new DOMException('请求超时', 'TimeoutError'));
        }, engine === 'doubao' ? 240000 : (questionCount > 20 ? 240000 : questionCount >= 15 ? 180000 : questionCount >= 10 ? 120000 : 60000));
      });

      // Race: fetch + stream read vs timeout
      const streamTask = (async () => {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body,
        signal: timeoutController.signal
      });

      if(!res.ok){
        const errText = await res.text();
        throw { status: res.status, message: errText };
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data: ')) continue;
          const data = trimmed.slice(6);
          if (data === '[DONE]') return;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta;
            if (delta?.reasoning_content) onReasoning(delta.reasoning_content);
            if (delta?.content) onContent(delta.content);
          } catch (_) {}
        }
      }
      })();

      try {
        await Promise.race([timeoutPromise, streamTask]);
      } catch(e) {
        if(e.status) {
          // HTTP error from streamTask
          const errText = e.message;
          lastErr = new Error(`API 错误 (${e.status}): ${errText.slice(0, 150)}`);
          clearTimeout(timeoutId);
          if(e.status >= 500 && attempt < retries){
            if(currentAbort?.signal?.aborted) throw new DOMException('用户取消', 'AbortError');
            console.warn(`%c⚠️ 流式请求第 ${attempt} 次失败 (${e.status})，${Math.pow(2,attempt)}秒后重试…`, 'color:#f1c40f');
            await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
            if(currentAbort?.signal?.aborted) throw new DOMException('用户取消', 'AbortError');
            continue;
          }
          throw lastErr;
        }
        throw e; // timeout or other
      }
      clearTimeout(timeoutId);
      return;
    }
    } catch(e) {
      throw e;
    }
  }

  // === Helpers ===
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // === Init ===
  init();
})();
</script>
